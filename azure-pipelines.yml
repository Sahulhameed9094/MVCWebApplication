trigger:
- master

pool:
  vmImage: windows-2022

steps:
- task: VSBuild@1
  inputs:
    solution: 'MVCWebAppSQL/MVCWebAppSQL.sqlproj'
    vsVersion: '17.0'
    configuration: 'release'
    clean: true
